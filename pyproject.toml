[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofin"
version = "0.1.0"
description = "Local-first multi-agent financial intelligence platform for stocks and ETFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "LoFin Maintainers"}]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "feedparser>=6.0",
  "yfinance>=0.2",
  "qdrant-client>=1.9",
  "tenacity>=8.2",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "apscheduler>=3.10",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.2", "plotly>=5.22"]
ml = ["transformers>=4.41", "torch>=2.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lofin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
